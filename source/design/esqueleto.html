<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCut Pessoal — esqueleto visual</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #171717; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { height: 100dvh; min-height: 600px; display: grid; grid-template-rows: 48px minmax(0, 1fr); gap: 6px; padding: 0 12px 12px; }
    .top { display: flex; align-items: center; gap: 16px; }
    .mark { width: 20px; height: 20px; border: 5px solid #111; border-radius: 6px; }
    .title { font-size: 14px; white-space: nowrap; }
    .spacer { flex: 1; }
    .status, .export { display: flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 14px; border: 1px solid #dedede; border-radius: 10px; font-size: 13px; white-space: nowrap; }
    .status { color: #555; }
    .export { color: white; background: #168ff2; border-color: #168ff2; font-weight: 700; }
    .workspace { display: grid; grid-template-rows: minmax(0, 1fr) minmax(280px, 1fr); gap: 6px; min-height: 0; }
    .upper { display: grid; grid-template-columns: 350px minmax(0, 1fr) 350px; gap: 8px; min-height: 0; }
    .box { min-width: 0; min-height: 0; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
    .assets { display: grid; grid-template-columns: 40px 1fr; }
    .rail { display: flex; flex-direction: column; align-items: center; gap: 19px; padding-top: 14px; border-right: 1px solid #ddd; color: #888; font-size: 18px; }
    .asset-main { padding: 10px; }
    .asset-head { display: flex; align-items: center; justify-content: space-between; height: 34px; font-size: 13px; color: #777; }
    .import { color: #111; font-weight: 700; border: 1px solid #ddd; background: white; padding: 7px 12px; border-radius: 5px; }
    .drop { display: grid; place-items: center; text-align: center; height: 150px; margin-top: 8px; border-radius: 15px; background: #ededed; color: #888; font-size: 12px; line-height: 1.6; }
    .preview { display: grid; grid-template-rows: minmax(0, 1fr) 45px; padding: 8px; }
    .screen { width: min(100%, calc((100dvh - 190px) * 1.5)); height: 100%; max-height: 100%; aspect-ratio: 16 / 9; margin: auto; background: #000; }
    .transport { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; color: #666; }
    .transport strong { color: #168ff2; font-family: monospace; }
    .inspector { display: grid; place-items: center; text-align: center; }
    .inspector strong { display: block; font-size: 16px; margin-bottom: 12px; }
    .inspector span { display: block; font-size: 12px; color: #888; }
    .timeline { display: grid; grid-template-rows: 40px 40px 1fr; overflow: hidden; }
    .timeline-head { display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid #ddd; color: #777; font-size: 13px; }
    .scene { margin: auto; color: #222; border: 1px solid #ddd; background: #f2f2f2; padding: 6px 14px; border-radius: 15px; }
    .ruler { display: flex; justify-content: space-between; align-items: flex-start; padding: 7px 12px 0 120px; color: #9a9a9a; font-family: monospace; font-size: 10px; }
    .tracks { position: relative; margin-left: 112px; border-left: 1px solid #ddd; }
    .tracks::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #0da5ff; }
    .track { height: 64px; border: 1px dashed #e1e1e1; border-radius: 4px; margin: 8px 0; }
    .mobile-tabs, .mobile-tools, .mobile-track-labels, .mobile-back { display: none; }
    @media (max-width: 700px) {
      .shell { min-height: 0; padding: 0 8px 8px; gap: 0; grid-template-rows: 52px minmax(0, 1fr); }
      .top { gap: 8px; }
      .mark { display: none; }
      .mobile-back { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #ddd; border-radius: 10px; font-size: 24px; }
      .title { font-size: 14px; }
      .status { border: 0; padding: 0 2px; font-size: 11px; min-height: 44px; }
      .export { min-height: 44px; padding: 0 8px; font-size: 12px; }
      .workspace { grid-template-rows: minmax(0, 59%) minmax(0, 41%); gap: 4px; }
      .upper { display: grid; grid-template-columns: 1fr; }
      .assets, .inspector { display: none; }
      .preview { border: 0; background: white; grid-template-rows: minmax(0, 1fr) 40px 54px; padding: 4px 0 0; }
      .screen { width: auto; height: min(100%, 42dvh); aspect-ratio: 9 / 16; }
      .transport { padding: 0 4px; }
      .mobile-tabs { display: flex; align-items: stretch; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
      .mobile-tabs span { flex: 1; display: grid; place-items: center; font-size: 12px; border-right: 1px solid #ddd; }
      .mobile-tabs span:first-child { color: #168ff2; background: #edf7ff; }
      .mobile-tabs span:last-child { border-right: 0; }
      .timeline { grid-template-rows: 48px 28px 1fr; }
      .timeline-head { display: none; }
      .mobile-tools { display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #ddd; font-size: 18px; color: #555; }
      .ruler { padding: 6px 8px 0 65px; }
      .tracks { margin-left: 64px; }
      .mobile-track-labels { display: flex; flex-direction: column; position: absolute; left: 10px; top: 20px; gap: 49px; color: #777; }
      .track { height: 58px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="mobile-back" aria-hidden="true">‹</div><div class="mark" aria-hidden="true"></div><div class="title">Novo projeto</div>
      <div class="spacer"></div><div class="status">☁ Sincronizado</div><div class="export">Exportar</div>
    </header>
    <main class="workspace">
      <section class="upper">
        <div class="box assets"><div class="rail"><span>▣</span><span>T</span><span>◉</span><span>⚙</span></div><div class="asset-main"><div class="asset-head"><span>Mídia</span><span class="import">Importar</span></div><div class="drop">Arraste vídeos, fotos e áudios<br>para importar</div></div></div>
        <div class="box preview"><div class="screen"></div><div class="transport"><span><strong>00:00:00:00</strong> / 00:00:00:00</span><span>▷</span><span>Ajustar ⛶</span></div><div class="mobile-tabs"><span>Mídia</span><span>Texto</span><span>Áudio</span><span>Ajustes</span></div></div>
        <div class="box inspector"><div><strong>Está vazio</strong><span>Selecione um item na linha do tempo<br>para editar suas propriedades</span></div></div>
      </section>
      <section class="box timeline"><div class="timeline-head"><span>✂</span><span>▤</span><span>▣</span><span>♧</span><span>▱</span><span>▥</span><span class="scene">Cena principal</span><span>−</span><span>＋</span></div><div class="mobile-tools"><span>✂</span><span>▣</span><span>▤</span><span>−</span><span>＋</span></div><div class="ruler"><span>00:00</span><span>00:01</span><span>00:02</span><span>00:03</span></div><div class="tracks"><div class="mobile-track-labels"><span>▣</span><span>♫</span></div><div class="track"></div><div class="track"></div></div></section>
    </main>
  </div>
</body>
</html>
